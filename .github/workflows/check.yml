name: Check example

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pypdf==6.21.0
      - name: Check Python syntax
        run: python -m compileall -q papercraft scripts build_tentacle.py export_color.py package_tentacle.py test_pipeline.py finish_patterns.py
      - name: Check printable example
        run: python scripts/check_example.py
